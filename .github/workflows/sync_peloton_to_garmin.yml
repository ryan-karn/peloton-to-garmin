# This is a workflow that will automatically sync your Peloton rides with Garmin

name: 🔄 Sync Workflow

# Controls when the action will run.
on:
  workflow_dispatch:
    inputs:
      workoutsToDownload:
        type: number
        default: "1"
      saveLocalCopy:
        type: boolean
        default: true
      renameFile:
        type: boolean
        default: false

env:
  OUTPUT_DIR: /app/output

jobs:
  sync:
    name: 🔄 Sync
    runs-on: ubuntu-latest
    container: 
      image:  philosowaffle/peloton-to-garmin:console-latest
      options: --user root
    steps:

    - name: 📁Create output directory
      run: mkdir -p ${{ env.OUTPUT_DIR }}

    - name: 🗃 Create config file
      env:
        DEFAULT_WORKOUT_NUM: 5
      run: |
        cat <<EOT > /app/configuration.local.json 
        {
          "App": {
            "EnablePolling": false,
            "CheckForUpdates": true,
            "CloseConsoleOnFinish": true
          },
          "Format": {
            "Fit": true,
            "Json": false,
            "Tcx": false,
            "SaveLocalCopy": ${{ github.event.inputs.saveLocalCopy || false }},
            "IncludeTimeInHRZones": false,
            "IncludeTimeInPowerZones": false,
            "StackedWorkouts": {
              "AutomaticallyStackWorkouts": true,
              "MaxAllowedGapSeconds": 120
            }
          },
          "Peloton": {
            "NumWorkoutsToDownload": ${{ github.event.inputs.workoutsToDownload || env.DEFAULT_WORKOUT_NUM }},
          },
          "Garmin": {
            "Upload": true,
            "FormatToUpload": "fit"
          },
          "Observability": {
            "Prometheus": {
              "Enabled": false
            },
            "Jaeger": {
              "Enabled": false
            },
            "Serilog": {
              "Using": [ "Serilog.Sinks.Console"],
              "MinimumLevel": "Information"
            }
          }
        }
        EOT
    
    - name: ▶ Run P2G Sync
      run: /app/ConsoleClient
      if: ${{ env.P2G_PELOTON__EMAIL && env.P2G_PELOTON__PASSWORD && env.P2G_GARMIN__EMAIL && env.P2G_GARMIN__PASSWORD }}
      working-directory: /app
      env:
        P2G_PELOTON__EMAIL: ${{ secrets.P2G_PELOTON__EMAIL }}
        P2G_PELOTON__PASSWORD: ${{ secrets.P2G_PELOTON__PASSWORD }}
        P2G_GARMIN__EMAIL: ${{ secrets.P2G_GARMIN__EMAIL }}
        P2G_GARMIN__PASSWORD: ${{ secrets.P2G_GARMIN__PASSWORD }}
        P2G_GARMIN__SERVICETICKET: ST-0252507-MF4sp7bm4nxYCS39Sq2r-sso
        TZ: America/Los_Angeles
        

    - name: Run-name fit file
      run: |
          count=0
          for file in ${{ env.OUTPUT_DIR }}/fit/*.fit; do
            # Check if the file actually exists
            if [ -f "$file" ]; then
              # Increment counter
              count=$((count + 1))
              echo "found: '$file' '$count'"
              
              # Remove colon from filename
              clean_name="${file//:/}"
            
              # Extract directory and filename
              dir_path=$(dirname "$clean_name")
              base_name=$(basename "$clean_name")
            
              # Construct the new filename with the counter
              new_name="${dir_path}/file_${count}_${base_name}"

              # Rename the file
              mv "$file" "$new_name"
            fi
          done
      if: ${{ github.event.inputs.renameFile == 'true' }}

    - name: ⤴ Upload output directory
      uses: actions/upload-artifact@v4
      if: ${{ github.event.inputs.saveLocalCopy == 'true' }}
      with:
        name: output
        path: ${{ env.OUTPUT_DIR }}
        if-no-files-found: error

